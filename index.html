<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Plataforma de Rutas</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; background: #f4f6f7; }
        header { background: #2c3e50; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .roles-nav a { color: white; text-decoration: none; background: #34495e; padding: 8px 15px; border-radius: 4px; font-size: 14px; font-weight: bold; }
        .panel-rol { display: none; padding: 15px; background: #ffffff; border-bottom: 2px solid #ddd; gap: 10px; flex-wrap: wrap; align-items: center; }
        .panel-rol.activo { display: flex; }
        input[type="text"], input[type="password"] { padding: 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; flex: 1; min-width: 180px; }
        button.accion { padding: 10px 15px; background: #2980b9; color: white; cursor: pointer; border: none; font-weight: bold; border-radius: 4px; }
        button.accion:hover { background: #2471a3; }
        button.eliminar { background: #c0392b; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        button.eliminar:hover { background: #a93226; }
        #map { flex-grow: 1; width: 100%; }
        .admin-table-container { width: 100%; max-height: 180px; overflow-y: auto; margin-top: 10px; border: 1px solid #ddd; background: #fff; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 6px 10px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #f8f9fa; }
        .login-box { display: flex; gap: 10px; width: 100%; max-width: 400px; margin-top: 5px; }
        .hint { font-size: 12px; color: #666; width: 100%; margin-top: -5px; }
    </style>
</head>
<body>

    <header>
        <h2>Panel de Administración</h2>
        <div class="roles-nav">
            <a href="conductor.html" target="_blank">Ir a Conductor ➔</a>
            <a href="pasajero.html" target="_blank">Ir a Pasajero ➔</a>
        </div>
    </header>

    <!-- LOGIN ADMIN -->
    <div id="panel-admin-login" class="panel-rol activo" style="flex-direction: column; align-items: flex-start;">
        <strong>Acceso Administrador:</strong>
        <div class="login-box">
            <input type="password" id="adminPasswordInput" placeholder="Ingrese clave">
            <button class="accion" id="btnLogAdmin">Entrar</button>
        </div>
    </div>

    <!-- PANEL ADMINISTRADOR -->
    <div id="panel-admin" class="panel-rol">
        <strong>Crear y Asignar Ruta:</strong>
        <input type="text" id="adminViajeId" placeholder="ID del Viaje (ej. ruta-01)" />
        <input type="text" id="adminOrigen" placeholder="Origen (Ej: Providencia, Stgo)" />
        <input type="text" id="adminDestino" placeholder="Destino (Ej: Valparaíso)" />
        <input type="text" id="adminConductor" placeholder="Nombre Conductor" />
        <button type="button" class="accion" id="btnGuardarRuta">Guardar y Asignar</button>
        <button type="button" class="accion" id="btnExportarExcel" style="background: #27ae60;">Exportar a Excel</button>
        <div class="hint">💡 El sistema calculará automáticamente la distancia vial en km y el costo estimado de combustible.</div>
        
        <div class="admin-table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID Viaje</th>
                        <th>Origen</th>
                        <th>Destino</th>
                        <th>Conductor</th>
                        <th>Distancia</th>
                        <th>Combustible Est.</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaRutasBody"></tbody>
            </table>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getDatabase, ref, set, remove, onValue } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBx8q4zbeMNBi5s209ZMNUnF3gKI8MDdc0",
            authDomain: "rutas-234e4.firebaseapp.com",
            databaseURL: "https://rutas-234e4-default-rtdb.firebaseio.com",
            projectId: "rutas-234e4",
            storageBucket: "rutas-234e4.firebasestorage.app",
            messagingSenderId: "169559501428",
            appId: "1:169559501428:web:419b64babc56d1da6eff21",
            measurementId: "G-GDNE6V9783"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const map = L.map('map').setView([-33.4489, -70.6693], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

        let todasLasRutasData = {};
        let markersMap = {};

        function verificarLogin() {
            const pass = document.getElementById('adminPasswordInput').value.trim();
            if (pass === "Rutas2026") {
                document.getElementById('panel-admin-login').classList.remove('activo');
                document.getElementById('panel-admin').classList.add('activo');
                cargarRutasAdmin();
            } else {
                alert("Clave de Administrador incorrecta. Debe ser Rutas2026");
            }
        }

        document.getElementById('btnLogAdmin').addEventListener('click', verificarLogin);
        document.getElementById('adminPasswordInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verificarLogin();
        });

        async function obtenerCoordenadas(direccion) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(direccion)}`);
                const data = await response.json();
                return data.length > 0 ? { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) } : null;
            } catch (e) { return null; }
        }

        // Función para calcular distancia vial y combustible usando OSRM
        async function calcularRutaYCombustible(lat1, lon1, lat2, lon2) {
            try {
                const url = `https://router.project-osrm.org/route/v1/driving/${lon1},${lat1};${lon2},${lat2}?overview=false`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.routes && data.routes.length > 0) {
                    const distanciaMetros = data.routes[0].distance; // en metros
                    const distanciaKm = (distanciaMetros / 1000).toFixed(1);

                    // Parámetros de cálculo: 
                    // Rendimiento estimado: 12 km por litro de bencina.
                    // Precio estimado litro: $1.300 CLP.
                    const rendimientoKmPorLitro = 12; 
                    const precioLitroBencina = 1300;

                    const litrosConsumidos = distanciaKm / rendimientoKmPorLitro;
                    const costoTotal = Math.round(litrosConsumidos * precioLitroBencina);

                    return {
                        distanciaText: `${distanciaKm} km`,
                        costoText: `$${costoTotal.toLocaleString('es-CL')} CLP`
                    };
                }
            } catch (e) {
                console.error("Error calculando ruta:", e);
            }
            return { distanciaText: "N/A", costoText: "N/A" };
        }

        document.getElementById('btnGuardarRuta').addEventListener('click', async () => {
            const viajeId = document.getElementById('adminViajeId').value.trim();
            const origenStr = document.getElementById('adminOrigen').value.trim();
            const destinoStr = document.getElementById('adminDestino').value.trim();
            const conductor = document.getElementById('adminConductor').value.trim();

            if (!viajeId || !origenStr || !destinoStr) {
                alert("Completa los campos obligatorios.");
                return;
            }

            alert("Calculando coordenadas, distancia y combustible...");
            const coordOrigen = await obtenerCoordenadas(origenStr);
            const coordDestino = await obtenerCoordenadas(destinoStr);

            if (!coordOrigen || !coordDestino) {
                alert("No se encontraron una o ambas direcciones. Verifica el formato.");
                return;
            }

            // Calcular distancia y combustible de forma automática
            const calculo = await calcularRutaYCombustible(coordOrigen.lat, coordOrigen.lng, coordDestino.lat, coordDestino.lng);

            set(ref(db, 'viajes/' + viajeId), {
                origen: origenStr, 
                destino: destinoStr, 
                conductor: conductor || "Sin asignar",
                origenLat: coordOrigen.lat, 
                origenLng: coordOrigen.lng, 
                destLat: coordDestino.lat, 
                destLng: coordDestino.lng, 
                distancia: calculo.distanciaText,
                combustible: calculo.costoText,
                estado: "Asignado"
            }).then(() => {
                alert(`¡Ruta ${viajeId} creada con éxito!\nDistancia: ${calculo.distanciaText}\nCosto estimado: ${calculo.costoText}`);
                document.getElementById('adminViajeId').value = '';
                document.getElementById('adminOrigen').value = '';
                document.getElementById('adminDestino').value = '';
                document.getElementById('adminConductor').value = '';
            });
        });

        window.eliminarRuta = function(viajeId) {
            if (confirm(`¿Estás seguro de eliminar la ruta ${viajeId}?`)) {
                remove(ref(db, 'viajes/' + viajeId)).then(() => {
                    if (markersMap[viajeId]) {
                        map.removeLayer(markersMap[viajeId]);
                        delete markersMap[viajeId];
                    }
                    alert("Ruta eliminada correctamente.");
                });
            }
        };

        function cargarRutasAdmin() {
            onValue(ref(db, 'viajes'), (snapshot) => {
                const data = snapshot.val();
                const tbody = document.getElementById('tablaRutasBody');
                tbody.innerHTML = '';
                
                Object.values(markersMap).forEach(m => map.removeLayer(m));
                markersMap = {};

                if (data) {
                    todasLasRutasData = data;
                    Object.keys(data).forEach(id => {
                        const r = data[id];
                        const dist = r.distancia || 'Calculando...';
                        const comb = r.combustible || 'Calculando...';

                        tbody.innerHTML += `<tr>
                            <td><b>${id}</b></td>
                            <td>${r.origen}</td>
                            <td>${r.destino}</td>
                            <td>${r.conductor}</td>
                            <td><b>${dist}</b></td>
                            <td style="color: #27ae60; font-weight: bold;">${comb}</td>
                            <td>${r.estado}</td>
                            <td><button class="eliminar" onclick="eliminarRuta('${id}')">Eliminar</button></td>
                        </tr>`;

                        if (r.origenLat && r.origenLng) {
                            const iconoOrigenVerde = L.icon({
                                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
                                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
                                iconSize: [25, 41], iconAnchor: [12, 41]
                            });
                            const marker = L.marker([r.origenLat, r.origenLng], { icon: iconoOrigenVerde }).addTo(map)
                                .bindPopup(`<b>ID:</b> ${id}<br><b>Conductor:</b> ${r.conductor}<br><b>Distancia:</b> ${dist}<br><b>Combustible Est.:</b> ${comb}`);
                            markersMap[id] = marker;
                        }
                    });
                } else {
                    todasLasRutasData = {};
                    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;">No hay rutas registradas</td></tr>`;
                }
            });
        }

        document.getElementById('btnExportarExcel').addEventListener('click', () => {
            if (Object.keys(todasLasRutasData).length === 0) { alert("No hay datos para exportar."); return; }
            const arrayDatos = Object.keys(todasLasRutasData).map(id => ({
                "ID Viaje": id, 
                "Origen": todasLasRutasData[id].origen, 
                "Destino": todasLasRutasData[id].destino,
                "Conductor": todasLasRutasData[id].conductor, 
                "Distancia": todasLasRutasData[id].distancia || 'N/A',
                "Gasto Combustible Est.": todasLasRutasData[id].combustible || 'N/A',
                "Estado": todasLasRutasData[id].estado
            }));
            const ws = XLSX.utils.json_to_sheet(arrayDatos);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Rutas");
            XLSX.writeFile(wb, "Reporte_Rutas.xlsx");
        });
    </script>
</body>
</html>
