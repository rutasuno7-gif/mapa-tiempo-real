<!-- 1. Cargar las librerías de jsPDF y AutoTable en tu HTML (en el <head>) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<!-- 2. Botonera al lado del Excel -->
<div class="acciones-tabla mb-3" style="margin-bottom: 20px;">
    <button id="btnExportarExcel" class="btn btn-success">Descargar Excel</button>
    <button id="btnGenerarCotizacion" class="btn btn-primary" style="margin-left: 10px;">Generar Cotización</button>
</div>

<!-- 3. Tabla con los checkboxes -->
<table class="table" id="tablaRegistros" border="1" cellpadding="8" cellspacing="0" style="width:100%; border-collapse: collapse;">
    <thead>
        <tr style="background-color: #f2f2f2;">
            <th style="width: 40px; text-align: center;"><input type="checkbox" id="seleccionarTodo"></th>
            <th>Ítem / Descripción</th>
            <th>Cantidad</th>
            <th>Precio Unit.</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td style="text-align: center;"><input type="checkbox" class="check-item" data-desc="did prefijo 9 prepago (40 canales salida)" data-precio="5000" data-cant="1"></td>
            <td>did prefijo 9 prepago (40 canales salida)</td>
            <td>1,00</td>
            <td>$ 5.000,00</td>
        </tr>
        <!-- Agrega más filas dinámicamente según tus registros -->
    </tbody>
</table>

<script>
// Seleccionar / Deseleccionar todos
document.getElementById('seleccionarTodo').addEventListener('change', function(e) {
    const checkboxes = document.querySelectorAll('.check-item');
    checkboxes.forEach(chk => chk.checked = e.target.checked);
});

// Lógica del botón Generar Cotización
document.getElementById('btnGenerarCotizacion').addEventListener('click', async function() {
    const seleccionados = document.querySelectorAll('.check-item:checked');
    
    if (seleccionados.length === 0) {
        alert('Por favor, selecciona al menos un registro para generar la cotización.');
        return;
    }

    let itemsCotizacion = [];
    let subtotalGeneral = 0;

    seleccionados.forEach(chk => {
        const cantidad = parseFloat(chk.dataset.cant);
        const precioUnit = parseFloat(chk.dataset.precio);
        const subtotal = cantidad * precioUnit;
        
        itemsCotizacion.push([
            chk.dataset.desc,
            cantidad.toFixed(2).replace('.', ','),
            `$ ${precioUnit.toLocaleString('es-CL', {minimumFractionDigits: 2})}`,
            "0,00",
            `$ ${subtotal.toLocaleString('es-CL', {minimumFractionDigits: 2})}`
        ]);

        subtotalGeneral += subtotal;
    });

    const neto = subtotalGeneral;
    const iva = neto * 0.19;
    const total = neto + iva;

    // Inicializar jsPDF
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    // Intentar cargar el logo desde el sitio web (o usar una URL de imagen base64 si prefieres asegurar el acceso)
    // Nota: Para evitar bloqueos CORS en el navegador, se recomienda usar una imagen en base64 o asegurarse de que el servidor permita acceso.
    try {
        // Ejemplo de inserción de cabecera institucional
        doc.setFont("helvetica", "bold");
        doc.setFontSize(14);
        doc.text("FONOIP SPA", 14, 20);
        
        doc.setFont("helvetica", "normal");
        doc.setFontSize(9);
        doc.text("R.U.T.: 76.104.754-K", 14, 25);
        doc.text("Dirección: MOISES CHACON 46, El Monte - Metropolitana", 14, 30);
        doc.text("Teléfono: 229479000 | E-mail: facturacion@fonoip.com", 14, 35);

        // Número de cotización y fecha a la derecha
        doc.setFont("helvetica", "bold");
        doc.setFontSize(12);
        doc.text("COTIZACIÓN N° 1471", 140, 20);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(9);
        doc.text("Fecha: " + new Date().toLocaleDateString('es-CL'), 140, 26);
        doc.text("Validez: 10 día(s)", 140, 31);

        // Línea divisoria
        doc.setLineWidth(0.5);
        doc.line(14, 40, 196, 40);

        // Datos del cliente
        doc.setFont("helvetica", "bold");
        doc.setFontSize(10);
        doc.text("Señores:", 14, 48);
        doc.setFont("helvetica", "normal");
        doc.text("FENIX TELECOM SPA", 35, 48);

        doc.setFont("helvetica", "bold");
        doc.text("Atte. Sr(a).:", 14, 54);
        doc.setFont("helvetica", "normal");
        doc.text("NELSON BARRA", 35, 54);

        doc.setFont("helvetica", "bold");
        doc.text("Rut:", 14, 60);
        doc.setFont("helvetica", "normal");
        doc.text("78.206.142-9", 35, 60);

        doc.setFont("helvetica", "bold");
        doc.text("Dirección:", 14, 66);
        doc.setFont("helvetica", "normal");
        doc.text("BANDERA 529 543", 35, 66);

        doc.setFont("helvetica", "bold");
        doc.text("Giro:", 110, 48);
        doc.setFont("helvetica", "normal");
        doc.text("OTRAS ACTIVIDADES DE TELECOMUNICACIONES N.C.P.", 125, 48, { maxWidth: 75 });

        doc.setFont("helvetica", "bold");
        doc.text("Comuna / Ciudad:", 110, 60);
        doc.setFont("helvetica", "normal");
        doc.text("Santiago / Metropolitana", 140, 60);

        doc.setFont("helvetica", "bold");
        doc.text("Email:", 110, 66);
        doc.setFont("helvetica", "normal");
        doc.text("bnelsonhxxc@gmail.com", 125, 66);

        doc.line(14, 75, 196, 75);

        // Tabla de ítems con AutoTable
        doc.autoTable({
            startY: 80,
            head: [['ITEM CANTIDAD', 'PRECIO UNIT.', '%DESCTO.', 'SUBTOTAL']],
            body: itemsCotizacion,
            theme: 'grid',
            headStyles: { fillColor: [41, 128, 185] },
            styles: { fontSize: 9 }
        });

        // Totales al pie de la tabla
        let finalY = doc.lastAutoTable.finalY + 10;
        
        doc.setFont("helvetica", "bold");
        doc.text("CONDICIONES COMERCIALES:", 14, finalY);
        doc.setFont("helvetica", "normal");
        doc.text("Cotización válida por 10 días. Forma de pago: PAGADO AL CONTADO", 14, finalY + 6);

        // Bloque de montos alineados a la derecha
        let montoX = 140;
        doc.text(`SUBTOTAL:`, montoX, finalY);
        doc.text(`$ ${neto.toLocaleString('es-CL', {minimumFractionDigits: 2})}`, 180, finalY, { align: 'right' });

        doc.text(`I.V.A. (19%):`, montoX, finalY + 6);
        doc.text(`$ ${iva.toLocaleString('es-CL', {minimumFractionDigits: 2})}`, 180, finalY + 6, { align: 'right' });

        doc.setFont("helvetica", "bold");
        doc.text(`TOTAL:`, montoX, finalY + 12);
        doc.text(`$ ${total.toLocaleString('es-CL', {minimumFractionDigits: 2})}`, 180, finalY + 12, { align: 'right' });

        // Descargar PDF
        doc.save("Cotizacion_Fonoip_1471.pdf");

    } catch (error) {
        console.error("Error generando el PDF:", error);
        alert("Ocurrió un error al generar el PDF.");
    }
});
</script>
