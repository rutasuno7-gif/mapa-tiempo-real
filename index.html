<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de Ruta en Tiempo Real - Chile</title>
    
    <!-- Leaflet CSS (Gratuito) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #panel-control {
            padding: 15px;
            background: #2c3e50;
            color: white;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        #panel-control input, #panel-control button {
            padding: 8px 12px;
            border-radius: 4px;
            border: none;
            font-size: 14px;
        }
        #panel-control button {
            background: #27ae60;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        #panel-control button:hover {
            background: #219653;
        }
        #map {
            flex-grow: 1;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Panel de Control para Conductor y Pasajero -->
    <div id="panel-control">
        <input type="text" id="origenInput" placeholder="Origen (ej. Santiago)" />
        <input type="text" id="destinoInput" placeholder="Destino (ej. Viña del Mar)" />
        <input type="text" id="viajeIdInput" placeholder="ID del Viaje (ej. viaje01)" />
        <button id="btnIniciar">Iniciar como Conductor</button>
        <button id="btnSeguir">Seguir como Pasajero</button>
    </div>

    <!-- Contenedor del Mapa -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Script Principal con tus credenciales de Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

        // Tu configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBx8q4zbeMNBi5s209ZMNUnF3gKI8MDdc0",
            authDomain: "rutas-234e4.firebaseapp.com",
            databaseURL: "https://rutas-234e4-default-rtdb.firebaseio.com",
            projectId: "rutas-234e4",
            storageBucket: "rutas-234e4.firebasestorage.app",
            messagingSenderId: "169559501428",
            appId: "1:169559501428:web:419b64babc56d1da6eff21",
            measurementId: "G-GDNE6V9783"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Inicializar el Mapa centrado en Chile
        const map = L.map('map').setView([-33.4489, -70.6693], 13);

        // Cargar capa gratuita de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let markerConductor = null;
        let watchId = null;

        // ==========================================
        // ROL 1: EL CONDUCTOR (Comparte su GPS)
        // ==========================================
        document.getElementById('btnIniciar').addEventListener('click', () => {
            const origen = document.getElementById('origenInput').value;
            const destino = document.getElementById('destinoInput').value;
            const viajeId = document.getElementById('viajeIdInput').value || "viaje_demo";

            if (!origen || !destino) {
                alert("Por favor ingresa origen y destino.");
                return;
            }

            alert("Iniciando transmisión de GPS...");

            if ("geolocation" in navigator) {
                watchId = navigator.geolocation.watchPosition((position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    // Guardar coordenadas actuales en Firebase Realtime Database
                    set(ref(db, 'viajes/' + viajeId), {
                        origen: origen,
                        destino: destino,
                        lat: lat,
                        lng: lng,
                        actualizado: Date.now()
                    });

                    // Mover el marcador en su propio mapa
                    if (!markerConductor) {
                        markerConductor = L.marker([lat, lng]).addTo(map).bindPopup("Tú (Conductor)").openPopup();
                    } else {
                        markerConductor.setLatLng([lat, lng]);
                    }
                    map.setView([lat, lng], 15);

                }, (error) => {
                    console.error("Error de GPS: ", error);
                    alert("No se pudo obtener la ubicación GPS. Revisa los permisos de tu navegador.");
                }, {
                    enableHighAccuracy: true,
                    maximumAge: 5000,
                    timeout: 10000
                });
            } else {
                alert("Tu navegador no soporta geolocalización.");
            }
        });

        // ==========================================
        // ROL 2: EL PASAJERO (Observa el progreso)
        // ==========================================
        document.getElementById('btnSeguir').addEventListener('click', () => {
            const viajeId = document.getElementById('viajeIdInput').value || "viaje_demo";
            
            if (watchId) navigator.geolocation.clearWatch(watchId);
            alert(`Conectando al seguimiento del viaje: ${viajeId}`);

            const viajeRef = ref(db, 'viajes/' + viajeId);

            // Escuchar cambios en tiempo real desde Firebase
            onValue(viajeRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    const { lat, lng, destino } = data;
                    
                    // Actualizar o crear marcador en el mapa del pasajero
                    if (!markerConductor) {
                        markerConductor = L.marker([lat, lng]).addTo(map).bindPopup(`Destino: ${destino}`).openPopup();
                    } else {
                        markerConductor.setLatLng([lat, lng]);
                    }
                    map.setView([lat, lng], 15);
                } else {
                    console.log("El viaje aún no ha comenzado o no existe.");
                }
            });
        });
    </script>
</body>
</html>
