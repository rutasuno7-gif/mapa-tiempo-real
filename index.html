<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Plataforma de Rutas</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- SheetJS para exportar a Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #f4f6f7;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .roles-nav a {
            color: white;
            text-decoration: none;
            background: #34495e;
            padding: 8px 15px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
        }
        .panel-rol {
            display: none;
            padding: 15px;
            background: #ffffff;
            border-bottom: 2px solid #ddd;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .panel-rol.active {
            display: flex;
        }
        input, button.accion {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        button.accion {
            background: #2980b9;
            color: white;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }
        button.accion:hover {
            background: #2471a3;
        }
        #map {
            flex-grow: 1;
            width: 100%;
        }
        .admin-table-container {
            width: 100%;
            max-height: 150px;
            overflow-y: auto;
            margin-top: 10px;
            border: 1px solid #ddd;
            background: #fff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 6px 10px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }
        th {
            background: #f8f9fa;
        }
        .hint {
            font-size: 12px;
            color: #666;
            width: 100%;
            margin-top: -5px;
        }
    </style>
</head>
<body>

    <header>
        <h2>Panel de Administración</h2>
        <div class="roles-nav">
            <a href="conductor.html" target="_blank">Ir a Conductor ➔</a>
            <a href="pasajero.html" target="_blank">Ir a Pasajero ➔</a>
        </div>
    </header>

    <!-- LOGIN ADMIN (Aquí corregido a type="password") -->
    <div id="panel-admin-login" class="panel-rol active">
        <strong>Acceso Administrador:</strong>
        <input type="password" id="adminPasswordInput" placeholder="Ingresa clave (Rutas2026)" />
        <button class="accion" id="btnLogAdmin">Entrar</button>
    </div>

    <!-- PANEL ADMINISTRADOR -->
    <div id="panel-admin" class="panel-rol">
        <strong>Crear y Asignar Ruta:</strong>
        <input type="text" id="adminViajeId" placeholder="ID del Viaje (ej. ruta-01)" />
        <input type="text" id="adminOrigen" placeholder="Origen (Ej: Providencia, Santiago, Chile)" />
        <input type="text" id="adminDestino" placeholder="Destino (Ej: Valparaíso, Chile)" />
        <input type="text" id="adminConductor" placeholder="Nombre Conductor" />
        <button class="accion" id="btnGuardarRuta">Guardar y Asignar</button>
        <button class="accion" id="btnExportarExcel" style="background: #27ae60;">Exportar a Excel</button>
        <div class="hint">💡 <b>Formato:</b> [Calle/Ciudad], [Comuna/Ciudad], [País]. El ID de viaje será la clave única para el chofer y cliente.</div>
        
        <div class="admin-table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID Viaje</th>
                        <th>Origen</th>
                        <th>Destino</th>
                        <th>Conductor</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tablaRutasBody"></tbody>
            </table>
        </div>
    </div>

    <div id="map"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBx8q4zbeMNBi5s209ZMNUnF3gKI8MDdc0",
            authDomain: "rutas-234e4.firebaseapp.com",
            databaseURL: "https://rutas-234e4-default-rtdb.firebaseio.com",
            projectId: "rutas-234e4",
            storageBucket: "rutas-234e4.firebasestorage.app",
            messagingSenderId: "169559501428",
            appId: "1:169559501428:web:419b64babc56d1da6eff21",
            measurementId: "G-GDNE6V9783"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const map = L.map('map').setView([-33.4489, -70.6693], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

        let todasLasRutasData = {};

        document.getElementById('btnLogAdmin').addEventListener('click', () => {
            const pass = document.getElementById('adminPasswordInput').value.trim();
            if (pass === "Rutas2026") {
                document.getElementById('panel-admin-login').classList.remove('active');
                document.getElementById('panel-admin').classList.add('active');
                cargarRutasAdmin();
            } else {
                alert("Clave de Administrador incorrecta.");
            }
        });

        async function obtenerCoordenadas(direccion) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(direccion)}`);
                const data = await response.json();
                return data.length > 0 ? { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) } : null;
            } catch (e) { return null; }
        }

        document.getElementById('btnGuardarRuta').addEventListener('click', async () => {
            const viajeId = document.getElementById('adminViajeId').value.trim();
            const origenStr = document.getElementById('adminOrigen').value.trim();
            const destinoStr = document.getElementById('adminDestino').value.trim();
            const conductor = document.getElementById('adminConductor').value.trim();

            if (!viajeId || !origenStr || !destinoStr) {
                alert("Completa los campos obligatorios.");
                return;
            }

            alert("Buscando coordenadas...");
            const coordOrigen = await obtenerCoordenadas(origenStr);
            const coordDestino = await obtenerCoordenadas(destinoStr);

            if (!coordOrigen || !coordDestino) {
                alert("No se encontraron una o ambas direcciones. Verifica el formato.");
                return;
            }

            set(ref(db, 'viajes/' + viajeId), {
                origen: origenStr, destino: destinoStr, conductor: conductor || "Sin asignar",
                lat: coordOrigen.lat, lng: coordOrigen.lng, destLat: coordDestino.lat, destLng: coordDestino.lng, estado: "Asignado"
            }).then(() => {
                alert(`¡Ruta ${viajeId} creada con éxito!`);
                document.getElementById('adminViajeId').value = '';
                document.getElementById('adminOrigen').value = '';
                document.getElementById('adminDestino').value = '';
                document.getElementById('adminConductor').value = '';
            });
        });

        function cargarRutasAdmin() {
            onValue(ref(db, 'viajes'), (snapshot) => {
                const data = snapshot.val();
                const tbody = document.getElementById('tablaRutasBody');
                tbody.innerHTML = '';
                if (data) {
                    todasLasRutasData = data;
                    Object.keys(data).forEach(id => {
                        const r = data[id];
                        tbody.innerHTML += `<tr><td><b>${id}</b></td><td>${r.origen}</td><td>${r.destino}</td><td>${r.conductor}</td><td>${r.estado}</td></tr>`;
                    });
                } else {
                    todasLasRutasData = {};
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No hay rutas registradas</td></tr>`;
                }
            });
        }

        document.getElementById('btnExportarExcel').addEventListener('click', () => {
            if (Object.keys(todasLasRutasData).length === 0) { alert("No hay datos."); return; }
            const arrayDatos = Object.keys(todasLasRutasData).map(id => ({
                "ID Viaje": id, "Origen": todasLasRutasData[id].origen, "Destino": todasLasRutasData[id].destino,
                "Conductor": todasLasRutasData[id].conductor, "Estado": todasLasRutasData[id].estado
            }));
            const ws = XLSX.utils.json_to_sheet(arrayDatos);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Rutas");
            XLSX.writeFile(wb, "Reporte_Rutas.xlsx");
        });
    </script>
</body>
</html>
