<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conductor - Transmisión GPS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; background: #f4f6f7; }
        header { background: #2c3e50; color: white; padding: 15px 20px; font-size: 18px; font-weight: bold; }
        .panel { padding: 15px; background: #ffffff; border-bottom: 2px solid #ddd; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        input { padding: 8px 12px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; }
        button { background: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button#btnFinalizarConductor { background: #c0392b; }
        button:hover { opacity: 0.9; }
        #map { flex-grow: 1; width: 100%; }
    </style>
</head>
<body>

    <header>🚗 Panel de Conductor - Ruta Asignada</header>

    <div class="panel">
        <strong>Ingresa tu ID de Viaje:</strong>
        <input type="text" id="condViajeId" placeholder="Ej. ruta-01" />
        <button id="btnIniciarConductor">Iniciar mi Ruta (GPS)</button>
        <button id="btnFinalizarConductor" style="display:none;">Finalizar Ruta</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBx8q4zbeMNBi5s209ZMNUnF3gKI8MDdc0",
            authDomain: "rutas-234e4.firebaseapp.com",
            databaseURL: "https://rutas-234e4-default-rtdb.firebaseio.com",
            projectId: "rutas-234e4",
            storageBucket: "rutas-234e4.firebasestorage.app",
            messagingSenderId: "169559501428",
            appId: "1:169559501428:web:419b64babc56d1da6eff21",
            measurementId: "G-GDNE6V9783"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const map = L.map('map').setView([-33.4489, -70.6693], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

        let markerConductor = null;
        let markerOrigen = null;
        let markerDestino = null;
        let polylineRuta = null;
        let watchId = null;
        let viajeActualId = null;

        const iconoAuto = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/741/741407.png',
            iconSize: [35, 35],
            iconAnchor: [17, 17]
        });

        document.getElementById('btnIniciarConductor').addEventListener('click', async () => {
            const viajeId = document.getElementById('condViajeId').value.trim();
            if (!viajeId) { alert("Ingresa el ID del viaje."); return; }

            const snapshot = await get(ref(db, 'viajes/' + viajeId));
            if (!snapshot.exists()) {
                alert("El ID de viaje ingresado no existe.");
                return;
            }

            const datosViaje = snapshot.val();
            viajeActualId = viajeId;
            alert("¡ID válido! Cargando origen y destino...");

            if (datosViaje.origenLat && datosViaje.origenLng) {
                markerOrigen = L.marker([datosViaje.origenLat, datosViaje.origenLng], {
                    icon: L.icon({
                        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
                        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
                        iconSize: [25, 41], iconAnchor: [12, 41]
                    })
                }).addTo(map).bindPopup(`<b>ORIGEN:</b> ${datosViaje.origen}`);
            }

            if (datosViaje.destLat && datosViaje.destLng) {
                markerDestino = L.marker([datosViaje.destLat, datosViaje.destLng], {
                    icon: L.icon({
                        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
                        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
                        iconSize: [25, 41], iconAnchor: [12, 41]
                    })
                }).addTo(map).bindPopup(`<b>DESTINO:</b> ${datosViaje.destino}`);
            }
            
            set(ref(db, 'viajes/' + viajeId + '/estado'), 'En curso');

            document.getElementById('btnIniciarConductor').style.display = 'none';
            document.getElementById('btnFinalizarConductor').style.display = 'inline-block';
            document.getElementById('condViajeId').disabled = true;

            if ("geolocation" in navigator) {
                watchId = navigator.geolocation.watchPosition((pos) => {
                    const latGPS = pos.coords.latitude;
                    const lngGPS = pos.coords.longitude;
                    const posAuto = [latGPS, lngGPS];

                    // Transmitimos a nodos exclusivos del conductor
                    set(ref(db, 'viajes/' + viajeId + '/conductorLat'), latGPS);
                    set(ref(db, 'viajes/' + viajeId + '/conductorLng'), lngGPS);

                    if (!markerConductor) {
                        markerConductor = L.marker(posAuto, { icon: iconoAuto }).addTo(map).bindPopup("Mi ubicación actual").openPopup();
                    } else {
                        markerConductor.setLatLng(posAuto);
                    }

                    if (datosViaje.destLat && datosViaje.destLng) {
                        const destCoords = [datosViaje.destLat, datosViaje.destLng];
                        if (!polylineRuta) {
                            polylineRuta = L.polyline([posAuto, destCoords], { color: '#2980b9', weight: 4 }).addTo(map);
                        } else {
                            polylineRuta.setLatLngs([posAuto, destCoords]);
                        }
                    }

                    map.setView(posAuto, 14);
                }, (err) => { alert("Error de GPS: " + err.message); }, { enableHighAccuracy: true });
            } else {
                alert("Tu dispositivo no soporta geolocalización.");
            }
        });

        document.getElementById('btnFinalizarConductor').addEventListener('click', () => {
            if (viajeActualId) {
                if (watchId) navigator.geolocation.clearWatch(watchId);
                set(ref(db, 'viajes/' + viajeActualId + '/estado'), 'Finalizado').then(() => {
                    alert("¡Ruta finalizada con éxito!");
                    location.reload();
                });
            }
        });
    </script>
</body>
</html>
