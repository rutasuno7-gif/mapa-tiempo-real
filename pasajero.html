<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasajero - Seguimiento de Ruta</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; background: #f4f6f7; }
        header { background: #2c3e50; color: white; padding: 15px 20px; font-size: 18px; font-weight: bold; }
        .panel { padding: 15px; background: #ffffff; border-bottom: 2px solid #ddd; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        input { padding: 8px 12px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; }
        button { background: #2980b9; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2471a3; }
        #map { flex-grow: 1; width: 100%; }
    </style>
</head>
<body>

    <header>📍 Seguimiento de Viaje en Vivo</header>

    <div class="panel">
        <strong>Ingresa tu ID de Viaje:</strong>
        <input type="text" id="pasViajeId" placeholder="Ej. ruta-01" />
        <button id="btnSeguirPasajero">Ver mi Ruta</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBx8q4zbeMNBi5s209ZMNUnF3gKI8MDdc0",
            authDomain: "rutas-234e4.firebaseapp.com",
            databaseURL: "https://rutas-234e4-default-rtdb.firebaseio.com",
            projectId: "rutas-234e4",
            storageBucket: "rutas-234e4.firebasestorage.app",
            messagingSenderId: "169559501428",
            appId: "1:169559501428:web:419b64babc56d1da6eff21",
            measurementId: "G-GDNE6V9783"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const map = L.map('map').setView([-33.4489, -70.6693], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

        let markerConductor = null;
        let markerOrigen = null;
        let markerDestino = null;
        let polylineRuta = null;

        const iconoAuto = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/741/741407.png',
            iconSize: [35, 35],
            iconAnchor: [17, 17]
        });

        const iconoOrigenVerde = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41]
        });

        const iconoDestinoRojo = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41]
        });

        document.getElementById('btnSeguirPasajero').addEventListener('click', async () => {
            const viajeId = document.getElementById('pasViajeId').value.trim();
            if (!viajeId) { alert("Ingresa el ID del viaje."); return; }

            const snapshot = await get(ref(db, 'viajes/' + viajeId));
            if (!snapshot.exists()) {
                alert("El ID de viaje ingresado no existe o es incorrecto.");
                return;
            }

            alert(`Conectando al seguimiento de: ${viajeId}`);

            onValue(ref(db, 'viajes/' + viajeId), (snapshotLive) => {
                const data = snapshotLive.val();
                if (data) {
                    const { origenLat, origenLng, destLat, destLng, conductorLat, conductorLng, origen, destino, conductor, estado } = data;
                    
                    // 1. Dibujar Origen Fijo (Verde) usando origenLat / origenLng
                    if (origenLat && origenLng && !markerOrigen) {
                        markerOrigen = L.marker([origenLat, origenLng], { icon: iconoOrigenVerde }).addTo(map).bindPopup(`<b>ORIGEN:</b> ${origen}`);
                    }

                    // 2. Dibujar Destino Fijo (Rojo)
                    if (destLat && destLng && !markerDestino) {
                        markerDestino = L.marker([destLat, destLng], { icon: iconoDestinoRojo }).addTo(map).bindPopup(`<b>DESTINO:</b> ${destino}`);
                    }

                    // 3. Dibujar Auto del Conductor y línea de ruta en tiempo real
                    if (conductorLat && conductorLng) {
                        const posAuto = [conductorLat, conductorLng];

                        if (!markerConductor) {
                            markerConductor = L.marker(posAuto, { icon: iconoAuto }).addTo(map).bindPopup(`Conductor: ${conductor}<br>Estado: ${estado}`).openPopup();
                        } else {
                            markerConductor.setLatLng(posAuto);
                        }

                        if (destLat && destLng) {
                            const destCoords = [destLat, destLng];
                            if (!polylineRuta) {
                                polylineRuta = L.polyline([posAuto, destCoords], { color: '#2980b9', weight: 4 }).addTo(map);
                            } else {
                                polylineRuta.setLatLngs([posAuto, destCoords]);
                            }
                        }

                        map.setView(posAuto, 14);
                    } else if (origenLat && origenLng) {
                        map.setView([origenLat, origenLng], 13);
                    }
                }
            });
        });
    </script>
</body>
</html>
